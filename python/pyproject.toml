[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastwan-litert"
version = "0.1.0"
description = "FastWan 2.1 1.3B text-to-video on LiteRT: exporter, desktop runtime and the reference the web / Android / iOS runtimes are checked against."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "safetensors>=0.4",
  "ai-edge-litert>=2.1",
]

[project.optional-dependencies]
# Exporting needs PyTorch and the converter; running does not.
export = ["torch>=2.9", "litert-torch>=0.8", "ai-edge-quantizer>=0.4"]
# `tests/test_parity.py` compares against Diffusers' WanTransformer3DModel.
test = ["pytest>=8", "diffusers>=0.43", "torch>=2.9", "litert-torch>=0.8", "ai-edge-quantizer>=0.4"]
# `fastwan-litert encode`: the UMT5-XXL prompt encoder (11 GB of weights).
encode = ["torch>=2.9", "transformers>=5", "sentencepiece"]

[project.scripts]
fastwan-litert = "fastwan_litert.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastwan_litert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
